---
layout: default
---
<article class="section" style="max-width:720px;">
  <span class="eyebrow">Blog</span>
  <h1>{{ page.title }}</h1>
  <p style="font-family:var(--font-mono);font-size:0.8rem;color:var(--tinta-suave);">
    {{ page.date | date: "%-d de %B, %Y" }}{% if page.author %} · {{ page.author }}{% endif %}
  </p>
  <div class="body" style="margin-top:1.4rem;font-size:1.02rem;line-height:1.75;">
    {{ content }}
  </div>
  <p style="margin-top:2.4rem;">
    <a href="{{ '/blog/' | relative_url }}" style="font-family:var(--font-mono);font-size:0.85rem;">← Volver al blog</a>
  </p>
</article>
