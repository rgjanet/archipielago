---
layout: default
---
<article class="section">
  <span class="eyebrow">{{ page.media_type | default: "Multimedia" }}</span>
  <h1>{{ page.title }}</h1>
  {% if page.related_author %}<p class="meta" style="font-family:var(--font-mono);color:var(--oro-viejo);">con {{ page.related_author }}</p>{% endif %}

  {% include media-toggle.html audio=page.audio_url video=page.video_url %}

  <div class="body">{{ content }}</div>
</article>
