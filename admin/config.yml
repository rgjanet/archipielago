backend:
  name: github
  repo: rgjanet/archipielago
  branch: main

media_folder: "assets/img/uploads"
public_folder: "/assets/img/uploads"

collections:
  - name: "authors"
    label: "Autores"
    folder: "_authors"
    create: true
    slug: "{{slug}}"
    identifier_field: title
    fields:
      - { label: "Nombre", name: "title", widget: "string" }
      - { label: "Género (opcional, para concordancia)", name: "gender", widget: "select", options: ["m", "f"], required: false }
      - { label: "Región de Puerto Rico", name: "region", widget: "string", required: false }
      - label: "Etiquetas"
        name: "tags"
        widget: "list"
        required: false
        hint: "Ej. poesía, narrativa, San Juan, emergente"
      - { label: "Foto", name: "photo", widget: "image", required: false }
      - { label: "Sitio web", name: "website", widget: "string", required: false }
      - { label: "Correo electrónico", name: "email", widget: "string", required: false }
      - { label: "Teléfono", name: "phone", widget: "string", required: false }
      - label: "Redes sociales"
        name: "redes"
        widget: "list"
        required: false
        fields:
          - { label: "Plataforma", name: "label", widget: "string", hint: "Ej. Instagram, Facebook, TikTok" }
          - { label: "Enlace o @usuario", name: "url", widget: "string" }
      - label: "Otros enlaces"
        name: "links"
        widget: "list"
        required: false
        hint: "Para lo que no encaje arriba — Wikipedia, entrevistas, prensa, etc."
        fields:
          - { label: "Texto", name: "label", widget: "string" }
          - { label: "URL", name: "url", widget: "string" }
      - { label: "Biografía", name: "body", widget: "markdown", required: false }

  - name: "works"
    label: "Obras"
    folder: "_works"
    create: true
    slug: "{{slug}}"
    identifier_field: title
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Autor (nombre exacto como aparece en Autores)", name: "author", widget: "string" }
      - { label: "Año", name: "year", widget: "string", required: false }
      - { label: "Género", name: "genre", widget: "string", required: false, hint: "Categoría principal, ej. Poesía, Novela — se usa como etiqueta destacada" }
      - label: "Categorías adicionales"
        name: "categories"
        widget: "list"
        required: false
        hint: "Ej. realismo mágico, literatura LGBTQ+, ensayo — para búsqueda y filtrado futuro"
      - { label: "Número de páginas", name: "pages", widget: "number", value_type: "int", min: 1, required: false }
      - { label: "Editorial", name: "publisher", widget: "string", required: false }
      - { label: "ISBN", name: "isbn", widget: "string", required: false }
      - { label: "Idioma", name: "language", widget: "select", options: ["Español", "Inglés", "Bilingüe", "Otro"], required: false }
      - { label: "Portada", name: "cover", widget: "image", required: false }
      - { label: "Descripción corta", name: "description", widget: "string", required: false, hint: "Se usa en tarjetas y listados — una o dos oraciones" }
      - { label: "Sinopsis", name: "synopsis", widget: "text", required: false, hint: "Descripción completa del libro — de qué trata, para la página de la obra" }
      - label: "Dónde conseguirlo"
        name: "buy_links"
        widget: "list"
        required: false
        hint: "Añade una entrada por cada tienda o sitio donde se pueda comprar"
        fields:
          - { label: "Tienda / sitio", name: "label", widget: "string", hint: "Ej. Librería CDA, Amazon, directo con la editorial" }
          - { label: "Enlace", name: "url", widget: "string", hint: "El link directo a la página de compra" }
      - { label: "Reseña / contenido", name: "body", widget: "markdown", required: false, hint: "Tu propio comentario o reseña sobre la obra, si aplica" }

  - name: "media"
    label: "Multimedia"
    folder: "_media"
    create: true
    slug: "{{slug}}"
    identifier_field: title
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - label: "Tipo"
        name: "media_type"
        widget: "select"
        options: ["Podcast", "Entrevista", "Reseña en video", "Reel"]
      - { label: "Autor relacionado", name: "related_author", widget: "string", required: false }
      - { label: "URL de audio (mp3)", name: "audio_url", widget: "string", required: false }
      - { label: "URL de video (mp4)", name: "video_url", widget: "string", required: false }
      - { label: "Notas / descripción", name: "body", widget: "markdown", required: false }

  - name: "map_locations"
    label: "Mapa"
    folder: "_map_locations"
    create: true
    slug: "{{slug}}"
    identifier_field: name
    preview_path: "lugares/{{slug}}"
    fields:
      - { label: "Nombre del lugar", name: "name", widget: "string", hint: "Si tiene varias sedes, usa el mismo nombre en cada entrada (ej. 'The Bookmark')" }
      - { label: "Sede / sucursal (opcional)", name: "sede", widget: "string", required: false, hint: "Ej. 'San Juan', 'Ponce' — para distinguir ubicaciones de un mismo negocio" }
      - label: "Tipo"
        name: "type"
        widget: "select"
        options: ["Librería", "Editorial", "Biblioteca", "Tertulia", "Evento", "Otro"]
      - { label: "Latitud", name: "lat", widget: "number", value_type: "float", min: -90, max: 90 }
      - { label: "Longitud", name: "lng", widget: "number", value_type: "float", min: -180, max: 180 }
      - { label: "Descripción", name: "description", widget: "text", required: false }
      - { label: "Sitio web", name: "website", widget: "string", required: false }
      - { label: "Teléfono", name: "phone", widget: "string", required: false }
      - { label: "Horario", name: "hours", widget: "string", required: false, hint: "Ej. Lun–Sáb 10am–6pm" }
      - { label: "Dirección", name: "address", widget: "string", required: false }
      - { label: "Foto", name: "photo", widget: "image", required: false }
      - label: "Redes sociales"
        name: "redes"
        widget: "list"
        required: false
        fields:
          - { label: "Plataforma", name: "label", widget: "string", hint: "Ej. Instagram, Facebook, TikTok" }
          - { label: "Enlace o @usuario", name: "url", widget: "string" }

  - name: "blog"
    label: "Blog"
    folder: "_blog"
    create: true
    slug: "{{slug}}"
    identifier_field: title
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Fecha", name: "date", widget: "datetime" }
      - { label: "Autor/a", name: "author", widget: "string", required: false }
      - { label: "Extracto", name: "description", widget: "text", required: false, hint: "Se usa en el listado del blog; si se deja vacío se toma del inicio del texto" }
      - { label: "Imagen destacada", name: "photo", widget: "image", required: false }
      - { label: "Autor/a relacionado/a (slug exacto)", name: "related_author", widget: "string", required: false, hint: "El slug del autor tal como aparece en su URL, ej. /autores/marigloria-palma/ → marigloria-palma" }
      - { label: "Lugar relacionado (slug exacto)", name: "related_place", widget: "string", required: false, hint: "El slug del lugar tal como aparece en su URL, ej. /lugares/the-bookmark/ → the-bookmark" }
      - { label: "URL de audio (mp3)", name: "audio_url", widget: "string", required: false, hint: "Si añades audio Y video, aparece un switch para alternar entre los dos" }
      - { label: "URL de video (mp4)", name: "video_url", widget: "string", required: false }
      - { label: "Código de embed", name: "embed_code", widget: "text", required: false, hint: "Pega aquí el <iframe> de YouTube, Spotify, etc. Aparece después del audio/video." }
      - { label: "Contenido", name: "body", widget: "markdown" }

  - name: "revista"
    label: "Revista"
    folder: "_revista"
    create: true
    slug: "{{slug}}"
    identifier_field: title
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Edición", name: "edicion", widget: "string", hint: "Usa el mismo texto exacto en todas las piezas de una misma edición — ej. 'Edición 1 — Verano 2026'" }
      - label: "Sección"
        name: "seccion"
        widget: "select"
        options: ["Ensayo", "Entrevista", "Ficción", "Poesía", "Reseña", "Reportaje", "Otro"]
      - { label: "Autor/a (como aparece en la firma)", name: "byline", widget: "string" }
      - { label: "Fecha de publicación", name: "date", widget: "datetime" }
      - { label: "Extracto", name: "description", widget: "text", required: false, hint: "Para la tabla de contenido de la edición" }
      - { label: "Imagen destacada", name: "photo", widget: "image", required: false }
      - { label: "Autor/a relacionado/a (slug exacto, opcional)", name: "related_author", widget: "string", required: false, hint: "Si escribe alguien que ya tiene perfil en Autores, aparecerá también ahí" }
      - { label: "Lugar relacionado (slug exacto, opcional)", name: "related_place", widget: "string", required: false }
      - { label: "URL de audio (mp3, opcional)", name: "audio_url", widget: "string", required: false }
      - { label: "URL de video (mp4, opcional)", name: "video_url", widget: "string", required: false }
      - { label: "Contenido", name: "body", widget: "markdown" }

  - name: "tiendas"
    label: "Librerías en línea"
    folder: "_tiendas"
    create: true
    slug: "{{slug}}"
    identifier_field: title
    fields:
      - { label: "Nombre", name: "title", widget: "string" }
      - { label: "Foto / Logo", name: "photo", widget: "image", required: false }
      - { label: "Sitio web", name: "website", widget: "string", hint: "Su tienda en línea — este es el dato más importante" }
      - { label: "Correo electrónico", name: "email", widget: "string", required: false }
      - { label: "Teléfono", name: "phone", widget: "string", required: false }
      - label: "Redes sociales"
        name: "redes"
        widget: "list"
        required: false
        fields:
          - { label: "Plataforma", name: "label", widget: "string", hint: "Ej. Instagram, Facebook, TikTok" }
          - { label: "Enlace o @usuario", name: "url", widget: "string" }
      - { label: "Envíos", name: "shipping", widget: "string", required: false, hint: "Ej. 'Envíos a toda la isla' o 'Solo P.R. y EE.UU.'" }
      - { label: "Lugar físico (slug exacto, opcional)", name: "lugar", widget: "string", required: false, hint: "Si también tienen tienda física ya en Lugares, escribe su slug — ej. /lugares/the-bookmark/ → the-bookmark" }
      - { label: "Descripción", name: "body", widget: "markdown", required: false }

  - name: "editoriales"
    label: "Editoriales"
    folder: "_editoriales"
    create: true
    slug: "{{slug}}"
    identifier_field: title
    fields:
      - { label: "Nombre", name: "title", widget: "string" }
      - { label: "Año de fundación", name: "founded", widget: "string", required: false }
      - { label: "Foto / Logo", name: "photo", widget: "image", required: false }
      - { label: "Sitio web", name: "website", widget: "string", required: false }
      - { label: "Correo electrónico", name: "email", widget: "string", required: false }
      - { label: "Teléfono", name: "phone", widget: "string", required: false }
      - label: "Redes sociales"
        name: "redes"
        widget: "list"
        required: false
        fields:
          - { label: "Plataforma", name: "label", widget: "string", hint: "Ej. Instagram, Facebook, TikTok" }
          - { label: "Enlace o @usuario", name: "url", widget: "string" }
      - { label: "Lugar físico (slug exacto, opcional)", name: "lugar", widget: "string", required: false, hint: "Si tienen tienda/oficina en el mapa, escribe su slug — ej. /lugares/editorial-upr/ → editorial-upr" }
      - { label: "Descripción / Bio", name: "body", widget: "markdown", required: false }
      - { label: "Lineamientos de sometimiento", name: "guidelines", widget: "markdown", required: false, hint: "Si aceptan manuscritos, describe el proceso aquí" }

  - name: "settings"
    label: "Ajustes del sitio"
    files:
      - name: "homepage"
        label: "Destacados de la portada"
        file: "_data/homepage.yml"
        fields:
          - { label: "Autor destacado (hero) — slug exacto", name: "hero_author", widget: "string", required: false, hint: "Slug del autor (de su URL). Vacío = se usa el más reciente" }
          - { label: "Obra destacada — slug exacto", name: "twocol_work", widget: "string", required: false, hint: "Slug de la obra (de su URL, ej. /obras/mi-obra/ → mi-obra)" }
          - { label: "Segunda obra destacada — slug exacto", name: "sidebar_work", widget: "string", required: false, hint: "Slug de la obra. Aparece en la tarjeta pequeña bajo el conteo del mapa" }
          - { label: "Entrada de blog destacada — slug exacto", name: "sidebar_post", widget: "string", required: false, hint: "Slug de la entrada (de su URL, ej. /blog/mi-entrada/ → mi-entrada)" }
          - { label: "Lugar destacado — slug exacto", name: "twocol_place", widget: "string", required: false, hint: "Slug del lugar (de su URL, ej. /lugares/the-bookmark/ → the-bookmark)" }
          - { label: "Multimedia destacado — slug exacto", name: "promo_media", widget: "string", required: false, hint: "Slug del episodio (de su URL, ej. /multimedia/mi-episodio/ → mi-episodio)" }
          - label: "Autores en 'Explora' (hasta 3)"
            name: "explore_authors"
            widget: "list"
            required: false
            max: 3
            field: { label: "Autor (slug exacto)", name: "item", widget: "string" }
          - label: "Obras en 'Explora' (hasta 3)"
            name: "explore_works"
            widget: "list"
            required: false
            max: 3
            field: { label: "Obra (slug exacto)", name: "item", widget: "string" }
          - label: "Lugares en 'Explora' (hasta 3)"
            name: "explore_places"
            widget: "list"
            required: false
            max: 3
            field: { label: "Lugar (slug exacto)", name: "item", widget: "string" }

      - name: "nav"
        label: "Navegación principal"
        file: "_data/nav.yml"
        fields:
          - label: "Enlaces"
            name: "links"
            widget: "list"
            hint: "El orden aquí es el orden en que aparecen en el menú"
            fields:
              - { label: "Texto", name: "label", widget: "string" }
              - { label: "URL", name: "url", widget: "string", hint: "Interno: /autores/  ·  Externo: https://..." }

      - name: "footer"
        label: "Pie de página"
        file: "_data/footer.yml"
        fields:
          - label: "Columnas"
            name: "columns"
            widget: "list"
            hint: "Cada columna es un grupo de enlaces con su propio título"
            fields:
              - { label: "Título de la columna", name: "heading", widget: "string" }
              - label: "Enlaces"
                name: "links"
                widget: "list"
                fields:
                  - { label: "Texto", name: "label", widget: "string" }
                  - { label: "URL", name: "url", widget: "string", hint: "Interno: /autores/  ·  Externo: https://instagram.com/tu-cuenta" }
