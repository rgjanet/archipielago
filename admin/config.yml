backend:
  name: github
  repo: rgjanet/archipielago
  branch: main

media_folder: "assets/img/uploads"
public_folder: "/assets/img/uploads"

collections:
  - name: "authors"
    label: "Autores"
    folder: "_authors"
    create: true
    slug: "{{slug}}"
    identifier_field: title
    fields:
      - { label: "Nombre", name: "title", widget: "string" }
      - { label: "Género (opcional, para concordancia)", name: "gender", widget: "select", options: ["m", "f"], required: false }
      - { label: "Región de Puerto Rico", name: "region", widget: "string", required: false }
      - label: "Etiquetas"
        name: "tags"
        widget: "list"
        required: false
        hint: "Ej. poesía, narrativa, San Juan, emergente"
      - { label: "Foto", name: "photo", widget: "image", required: false }
      - label: "Enlaces"
        name: "links"
        widget: "list"
        required: false
        fields:
          - { label: "Texto", name: "label", widget: "string" }
          - { label: "URL", name: "url", widget: "string" }
      - { label: "Biografía", name: "body", widget: "markdown" }

  - name: "works"
    label: "Obras"
    folder: "_works"
    create: true
    slug: "{{slug}}"
    identifier_field: title
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Autor (nombre exacto como aparece en Autores)", name: "author", widget: "string" }
      - { label: "Año", name: "year", widget: "string", required: false }
      - { label: "Género", name: "genre", widget: "string", required: false }
      - { label: "Portada", name: "cover", widget: "image", required: false }
      - { label: "Descripción corta", name: "description", widget: "string", required: false }
      - { label: "Dónde conseguirlo", name: "purchase_url", widget: "string", required: false }
      - { label: "Reseña / contenido", name: "body", widget: "markdown", required: false }

  - name: "media"
    label: "Multimedia"
    folder: "_media"
    create: true
    slug: "{{slug}}"
    identifier_field: title
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - label: "Tipo"
        name: "media_type"
        widget: "select"
        options: ["Podcast", "Entrevista", "Reseña en video", "Reel"]
      - { label: "Autor relacionado", name: "related_author", widget: "string", required: false }
      - { label: "URL de audio (mp3)", name: "audio_url", widget: "string", required: false }
      - { label: "URL de video (mp4)", name: "video_url", widget: "string", required: false }
      - { label: "Notas / descripción", name: "body", widget: "markdown", required: false }

  - name: "map_locations"
    label: "Mapa"
    folder: "_map_locations"
    create: true
    slug: "{{slug}}"
    identifier_field: name
    preview_path: "lugares/{{slug}}"
    fields:
      - { label: "Nombre del lugar", name: "name", widget: "string", hint: "Si tiene varias sedes, usa el mismo nombre en cada entrada (ej. 'The Bookmark')" }
      - { label: "Sede / sucursal (opcional)", name: "sede", widget: "string", required: false, hint: "Ej. 'San Juan', 'Ponce' — para distinguir ubicaciones de un mismo negocio" }
      - label: "Tipo"
        name: "type"
        widget: "select"
        options: ["Librería", "Editorial", "Biblioteca", "Tertulia", "Evento", "Otro"]
      - { label: "Latitud", name: "lat", widget: "number", value_type: "float", min: -90, max: 90 }
      - { label: "Longitud", name: "lng", widget: "number", value_type: "float", min: -180, max: 180 }
      - { label: "Descripción", name: "description", widget: "text", required: false }
      - { label: "Sitio web", name: "website", widget: "string", required: false }
      - { label: "Teléfono", name: "phone", widget: "string", required: false }
      - { label: "Horario", name: "hours", widget: "string", required: false, hint: "Ej. Lun–Sáb 10am–6pm" }
      - { label: "Dirección", name: "address", widget: "string", required: false }
      - { label: "Foto", name: "photo", widget: "image", required: false }
      - label: "Redes sociales"
        name: "redes"
        widget: "list"
        required: false
        fields:
          - { label: "Plataforma", name: "label", widget: "string", hint: "Ej. Instagram, Facebook, TikTok" }
          - { label: "Enlace o @usuario", name: "url", widget: "string" }

  - name: "blog"
    label: "Blog"
    folder: "_blog"
    create: true
    slug: "{{slug}}"
    identifier_field: title
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Fecha", name: "date", widget: "datetime" }
      - { label: "Autor/a", name: "author", widget: "string", required: false }
      - { label: "Extracto", name: "description", widget: "text", required: false, hint: "Se usa en el listado del blog; si se deja vacío se toma del inicio del texto" }
      - { label: "Imagen destacada", name: "photo", widget: "image", required: false }
      - { label: "Autor/a relacionado/a", name: "related_author", widget: "relation", collection: "authors", search_fields: ["title"], value_field: "title", display_fields: ["title"], required: false, hint: "Si esta entrada es una entrevista o pieza sobre un autor, aparecerá en su perfil" }
      - { label: "Lugar relacionado", name: "related_place", widget: "relation", collection: "map_locations", search_fields: ["name"], value_field: "name", display_fields: ["name"], required: false, hint: "Si esta entrada es sobre una librería, editorial, etc., aparecerá en su página" }
      - { label: "URL de audio (mp3)", name: "audio_url", widget: "string", required: false, hint: "Si añades audio Y video, aparece un switch para alternar entre los dos" }
      - { label: "URL de video (mp4)", name: "video_url", widget: "string", required: false }
      - { label: "Código de embed", name: "embed_code", widget: "text", required: false, hint: "Pega aquí el <iframe> de YouTube, Spotify, etc. Aparece después del audio/video." }
      - { label: "Contenido", name: "body", widget: "markdown" }

  - name: "settings"
    label: "Portada"
    files:
      - name: "homepage"
        label: "Destacados de la portada"
        file: "_data/homepage.yml"
        fields:
          - { label: "Autor destacado (hero)", name: "hero_author", widget: "relation", collection: "authors", search_fields: ["title"], value_field: "title", display_fields: ["title"], required: false, hint: "Vacío = se usa el más reciente" }
          - { label: "Obra destacada", name: "twocol_work", widget: "relation", collection: "works", search_fields: ["title"], value_field: "title", display_fields: ["title"], required: false }
          - { label: "Segunda obra destacada (bajo el mapa)", name: "sidebar_work", widget: "relation", collection: "works", search_fields: ["title"], value_field: "title", display_fields: ["title"], required: false, hint: "Aparece en la tarjeta pequeña bajo el conteo del mapa" }
          - { label: "Entrada de blog destacada", name: "sidebar_post", widget: "relation", collection: "blog", search_fields: ["title"], value_field: "title", display_fields: ["title"], required: false, hint: "Segunda tarjeta pequeña, junto a la obra destacada" }
          - { label: "Lugar destacado", name: "twocol_place", widget: "relation", collection: "map_locations", search_fields: ["name"], value_field: "name", display_fields: ["name"], required: false }
          - { label: "Multimedia destacado (banda coral)", name: "promo_media", widget: "relation", collection: "media", search_fields: ["title"], value_field: "title", display_fields: ["title"], required: false }
          - label: "Autores en 'Explora' (hasta 3)"
            name: "explore_authors"
            widget: "list"
            required: false
            max: 3
            field: { label: "Autor", name: "item", widget: "relation", collection: "authors", search_fields: ["title"], value_field: "title", display_fields: ["title"] }
          - label: "Obras en 'Explora' (hasta 3)"
            name: "explore_works"
            widget: "list"
            required: false
            max: 3
            field: { label: "Obra", name: "item", widget: "relation", collection: "works", search_fields: ["title"], value_field: "title", display_fields: ["title"] }
          - label: "Lugares en 'Explora' (hasta 3)"
            name: "explore_places"
            widget: "list"
            required: false
            max: 3
            field: { label: "Lugar", name: "item", widget: "relation", collection: "map_locations", search_fields: ["name"], value_field: "name", display_fields: ["name"] }
