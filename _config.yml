title: Archipiélago
tagline: Un mapa de las letras puertorriqueñas
description: >
  Archipiélago reúne autores, obras y voces de la literatura puertorriqueña
  independiente en un mismo lugar — un mapa vivo de dónde y cómo se escribe
  la isla hoy.
baseurl: "/archipielago"
url: "https://rgjanet.com"

markdown: kramdown
permalink: /:collection/:slug/

collections:
  authors:
    output: true
    permalink: /autores/:slug/
  works:
    output: true
    permalink: /obras/:slug/
  media:
    output: true
    permalink: /multimedia/:slug/
  map_locations:
    output: true
    permalink: /lugares/:slug/
  blog:
    output: true
    permalink: /blog/:slug/
  editoriales:
    output: true
    permalink: /editoriales/:slug/
  tiendas:
    output: true
    permalink: /tiendas-en-linea/:slug/
  revista:
    output: true
    permalink: /revista/:slug/

defaults:
  - scope:
      path: ""
      type: authors
    values:
      layout: author
  - scope:
      path: ""
      type: works
    values:
      layout: work
  - scope:
      path: ""
      type: media
    values:
      layout: media
  - scope:
      path: ""
      type: map_locations
    values:
      layout: place
  - scope:
      path: ""
      type: blog
    values:
      layout: post
  - scope:
      path: ""
      type: editoriales
    values:
      layout: editorial
  - scope:
      path: ""
      type: tiendas
    values:
      layout: tienda
  - scope:
      path: ""
      type: revista
    values:
      layout: articulo

plugins:
  - jekyll-relative-links

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
