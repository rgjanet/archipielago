---
layout: default
title: Mapa
---
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  #map-app {
    display: grid;
    grid-template-columns: 340px 1fr;
    height: 78vh;
    min-height: 560px;
    border: var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    margin-top: 1.4rem;
  }
  #map-sidebar {
    background: var(--mar-profundo);
    color: var(--papel);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border-right: 6px solid var(--coral);
  }
  #map-filter {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    padding: 16px 20px;
    border-bottom: 1px solid rgba(242,236,220,0.18);
  }
  #map-filter button {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    letter-spacing: 0.03em;
    background: none;
    border: 1px solid rgba(242,236,220,0.4);
    color: var(--papel);
    border-radius: 999px;
    padding: 0.3rem 0.7rem;
    cursor: pointer;
  }
  #map-filter button.active { background: var(--coral); border-color: var(--coral); }
  #map-list-wrap { flex: 1; overflow-y: auto; }
  .place-card {
    padding: 14px 20px;
    border-bottom: 1px solid rgba(242,236,220,0.14);
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .place-card:hover, .place-card.active { background: rgba(232,96,63,0.18); }
  .place-card .name { font-family: var(--font-display); font-size: 1rem; margin: 0 0 3px; color: var(--papel-alto); }
  .place-card .type { font-family: var(--font-mono); font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.06em; color: rgba(242,236,220,0.65); margin: 0 0 5px; }
  .place-card .desc { font-size: 0.82rem; color: rgba(242,236,220,0.85); margin: 0; line-height: 1.4; }
  #map-count {
    padding: 10px 20px;
    font-family: var(--font-mono);
    font-size: 0.68rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: rgba(242,236,220,0.55);
    border-top: 1px solid rgba(242,236,220,0.18);
  }
  #lit-map { width: 100%; height: 100%; }
  .leaflet-popup-content-wrapper { background: var(--papel-alto); color: var(--tinta); border-radius: 3px; }
  .leaflet-popup-tip { background: var(--papel-alto); }
  .pin-popup .name { font-family: var(--font-display); font-weight: 600; color: var(--mar-profundo); font-size: 1rem; margin: 0 0 4px; }
  .pin-popup .type { font-family: var(--font-mono); font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--oro-viejo); margin: 0 0 6px; }
  .pin-popup .desc { font-size: 0.85rem; line-height: 1.5; margin: 0 0 8px; }
  .pin-popup a { font-family: var(--font-mono); font-size: 0.78rem; color: var(--coral); }
  @media (max-width: 720px) {
    #map-app { grid-template-columns: 1fr; grid-template-rows: 40vh 45vh; height: auto; }
    #map-sidebar { border-right: none; border-bottom: 6px solid var(--coral); }
  }
</style>

<section class="section">
  <span class="eyebrow">Archipiélago</span>
  <h1>El mapa literario</h1>
  <p style="max-width:56ch;color:var(--tinta-suave);">
    Librerías, casas editoriales, tertulias y lugares donde se hace y se
    lee literatura puertorriqueña — añadidos desde el CMS, sin tocar código.
  </p>

  <div id="map-app">
    <div id="map-sidebar">
      <div id="map-filter"></div>
      <div id="map-list-wrap"><div id="map-list"></div></div>
      <div id="map-count">0 lugares</div>
    </div>
    <div id="lit-map"></div>
  </div>
</section>

<script>
  window.MAP_LOCATIONS = [
    {% for loc in site.map_locations %}
    {
      "name": {{ loc.name | jsonify }},
      "type": {{ loc.type | default: "Otro" | jsonify }},
      "lat": {{ loc.lat | default: 0 }},
      "lng": {{ loc.lng | default: 0 }},
      "description": {{ loc.description | default: "" | jsonify }},
      "url": {{ loc.url | default: "" | jsonify }}
    }{% unless forloop.last %},{% endunless %}
    {% endfor %}
  ];
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="{{ '/assets/js/map.js' | relative_url }}"></script>
