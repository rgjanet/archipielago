<nav class="site-nav">
  <a class="brand" href="{{ '/' | relative_url }}">Archipiélago</a>
  <div class="links">
    {% for item in site.data.nav.links %}
      {% if item.url contains "http" %}
      <a href="{{ item.url }}">{{ item.label }}</a>
      {% else %}
      <a href="{{ item.url | relative_url }}">{{ item.label }}</a>
      {% endif %}
    {% endfor %}
  </div>
</nav>
