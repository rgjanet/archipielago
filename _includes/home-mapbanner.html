<div class="map-banner">
  <div class="map-banner-inner">
    <div>
      <span class="kicker-tag" style="color:var(--coral);">Mapa literario</span>
      <h2>{{ include.heading | default: "Explora el archipiélago en el mapa" }}</h2>
      <p class="dek">{{ site.map_locations.size }} lugares registrados. Librerías, editoriales, bibliotecas y espacios donde vive la literatura puertorriqueña.</p>
      <a class="cta" href="{{ '/mapa/' | relative_url }}">Ver el mapa completo →</a>
    </div>
    <svg class="map-banner-dots" width="220" height="140" viewBox="0 0 220 140" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle cx="30" cy="30" r="5" fill="#E8603F"/>
      <circle cx="90" cy="20" r="7" fill="#F2ECDC" fill-opacity="0.5"/>
      <circle cx="150" cy="45" r="4" fill="#B98F4C"/>
      <circle cx="50" cy="75" r="6" fill="#E8603F" fill-opacity="0.7"/>
      <circle cx="180" cy="80" r="5" fill="#F2ECDC" fill-opacity="0.4"/>
      <circle cx="110" cy="105" r="6" fill="#B98F4C"/>
      <circle cx="30" cy="120" r="5" fill="#E8603F" fill-opacity="0.6"/>
    </svg>
  </div>
</div>
