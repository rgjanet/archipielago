---
layout: default
title: Multimedia
---
<section class="section">
  <span class="eyebrow">Escucha y mira</span>
  <h1>Multimedia</h1>
  <p style="max-width:52ch;color:var(--tinta-suave);">
    Podcast, entrevistas y reseñas en audio y video.
  </p>

  <div class="card-grid">
    {% for item in site.media %}
    <a class="card" href="{{ item.url | relative_url }}">
      <span class="meta">{{ item.media_type | default: "Multimedia" }}</span>
      <h3>{{ item.title }}</h3>
      {% if item.related_author %}<p>con {{ item.related_author }}</p>{% endif %}
    </a>
    {% endfor %}
  </div>
</section>
